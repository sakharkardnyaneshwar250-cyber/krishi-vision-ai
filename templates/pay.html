<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Payment - Krishi Vision AI</title>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
body {
    font-family: Arial;
    background: #2e7d32;
    margin: 0;
    padding: 0;
    text-align: center;
}

.container {
    background: white;
    width: 90%;
    max-width: 400px;
    margin: 50px auto;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

h2 {
    color: #2e7d32;
}

.btn {
    width: 100%;
    padding: 12px;
    margin-top: 15px;
    border: none;
    background: #43a047;
    color: white;
    border-radius: 8px;
    cursor: pointer;
}

.btn:hover {
    background: #1b5e20;
}
</style>
</head>

<body>

<div class="container">
    <h2>💳 Payment</h2>
    <p>Click below to complete your payment</p>

    <button class="btn" onclick="startPayment()">Pay Now</button>

    <a href="/">
        <button class="btn">⬅ Cancel</button>
    </a>
</div>

<script>
function startPayment() {
    var options = {
        "key": "rzp_test_SifWo24DcJ7yuT",  // 🔥 apni real test key
        "amount": "{{ order.amount }}",
        "currency": "INR",
        "name": "Krishi Vision AI",
        "description": "Crop Medicine Payment",
        "order_id": "{{ order.id }}",

        "handler": function (response){
            alert("Payment Successful ✅");
            window.location.href = "/";
        },

        "theme": {
            "color": "#2e7d32"
        }
    };

    var rzp = new Razorpay(options);
    rzp.open();
}
</script>

</body>
</html>
