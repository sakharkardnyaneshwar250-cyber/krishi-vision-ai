<!DOCTYPE html>
<html lang="en">
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Krishi Vision AI</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #56ab2f, #a8e063);
    margin: 0;
    padding: 0;
}

/* Header */
.header {
    background: #2e7d32;
    color: white;
    padding: 15px;
    text-align: center;
}

/* Search bar */
.search-bar {
    display: flex;
    justify-content: center;
    gap: 5px;
    margin: 15px;
    padding: 0 10px;
}

.search-bar input {
    flex: 1;
    padding: 10px;
    border-radius: 8px;
    border: none;
}

.search-bar button {
    padding: 10px;
    background: green;
    color: white;
    border: none;
    border-radius: 8px;
}

/* Banner */
.banner {
    background: linear-gradient(green, lightgreen);
    color: white;
    padding: 20px;
    border-radius: 10px;
    margin: 15px;
    text-align: center;
}

/* Card */
.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    width: 90%;
    max-width: 400px;
    margin: 20px auto;
    box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    text-align: center;
}

/* Inputs */
input[type="file"],
select {
    width: 100%;
    padding: 10px;
    margin: 10px 0;
    border-radius: 8px;
    border: 1px solid #ccc;
}

/* Button */
.btn {
    width: 100%;
    padding: 12px;
    background: #2e7d32;
    color: white;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}

.btn:hover {
    background: #1b5e20;
}

/* Mobile adjustments */
@media (max-width: 600px) {
    .banner h2 {
        font-size: 18px;
    }

    .banner p {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<!-- Header -->
<div class="header">
    <h2>🌿 Krishi Vision AI</h2>
</div>

<!-- Search -->
<div class="search-bar">
    <input type="text" placeholder="Search medicines, crops...">
    <button>Search</button>
</div>

<!-- Banner -->
<div class="banner">
    <h2>Smart Crop Disease Detection 🌾</h2>
    <p>Upload image and get instant solution</p>
</div>

<!-- Upload Card -->
<div class="card">
    <h2>Upload Leaf Image</h2>

    <form action="/predict" method="post" enctype="multipart/form-data">

        <input type="file" name="file" required>

        <select name="crop" required>
            <option value="">पीक निवडा</option>
            <option value="soyabean">सोयाबीन</option>
            <option value="cotton">कापूस</option>
            <option value="wheat">गहू</option>
        </select>

        <button type="submit" class="btn">🔍 Predict Disease</button>

    </form>
</div>

</body>
</html>
